name: Build XG2010G Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        # GitHub Actions checks out into /home/runner/work/<repo>/<repo>,
        # which pushes host-python install paths past OpenWrt's 124-char
        # limit (e.g. i2c-tools' py-smbus). Build from a short path instead.
        working-directory: /home/runner/w
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create short build directory
        working-directory: ${{ github.workspace }}
        run: |
          git clone --quiet --local "$GITHUB_WORKSPACE" /home/runner/w
          git -C /home/runner/w checkout --quiet --detach "$GITHUB_SHA"

      - name: Generate build version
        id: version
        run: |
          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit_full=$(git rev-parse HEAD)
          repo_commit=$(git rev-parse --short=8 HEAD)
          upstream_commit=$(sed -n 's/^commit=//p' .brightspeed-upstream | cut -c1-8)
          test -n "$upstream_commit"
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          version_number="${build_date}-${repo_commit}"
          version_code="${build_id}"

          echo "date=$build_date" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "repo_commit=$repo_commit" >> "$GITHUB_OUTPUT"
          echo "repo_commit_full=$repo_commit_full" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "version_number=$version_number" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "device_model=XG2010G" >> "$GITHUB_OUTPUT"
          echo "Build version: ImmortalWrt-for-Gemtek-XG2010G $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Select feed providers
        run: FEED_PATCHES_STRICT=1 bash scripts/select-feed-providers.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          bash scripts/apply-xg2010g-package-policy.sh 2010.config
          cp 2010.config .config
          make defconfig
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          VERSION_CODE='${{ steps.version.outputs.version_code }}' \
          bash scripts/set-build-version.sh .config
          bash scripts/check-distfeeds.sh
          bash scripts/check-gemtek-profile-isolation.sh --config .config
          bash scripts/check-xg2010g-only.sh
          grep -q '^CONFIG_VERSION_DIST="ImmortalWrt naoki66 ' .config
          grep -q '^CONFIG_VERSION_PRODUCT="XG2010G"' .config
          grep -q '^CONFIG_VERSION_NUMBER="' .config
          grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_PRODUCT|VERSION_NUMBER|VERSION_CODE|VERSION_FILENAMES|VERSION_CODE_FILENAMES)[= ]' .config

      - name: Verify libffi build dependency
        run: |
          test -f package/libs/libffi/Makefile
          awk '
            /^Source-Makefile:/ { in_libffi = ($2 == "package/libs/libffi/Makefile") }
            in_libffi && /^Package: libffi$/ { have_package = 1 }
            in_libffi && /^Build-Types:/ {
              for (i = 2; i <= NF; i++) if ($i == "host") have_host = 1
            }
            END {
              if (!have_package || !have_host) {
                print "libffi package with host build support is missing from package metadata" > "/dev/stderr"
                exit 1
              }
            }
          ' tmp/.packageinfo

      - name: Download sources
        shell: bash
        run: |
          set -o pipefail
          make download -j$(nproc) BUILD_LOG=1 2>&1 | tee download.log

      - name: Build Firmware
        shell: bash
        run: |
          rm -f build.status
          set -m
          (
            make -j"$(nproc)" world BUILD_LOG=1 > build.log 2>&1
            echo $? > build.status
          ) &
          pid=$!
          set +m
          i=0
          while [ ! -f build.status ]; do
            sleep 60
            i=$((i + 1))
            if grep -qE 'ERROR: .*failed to build|make: \*\*\*' build.log; then
              echo "=== build reported an error, stopping the process group ==="
              kill -TERM -- -"$pid" 2>/dev/null || true
              sleep 10
              kill -KILL -- -"$pid" 2>/dev/null || true
              break
            fi
            if [ $((i % 5)) -eq 0 ]; then
              echo "=== $(date -u +%H:%M:%S) build heartbeat ==="
              tail -n 3 build.log || true
              ps -eo etime,comm,args --sort=-etime \
                | grep -E 'cc1plus|cc1 |g\+\+|ninja|rustc' \
                | grep -v grep | head -5 || true
            fi
          done
          wait "$pid" || true
          status=$(cat build.status 2>/dev/null || echo 1)
          echo "=== build finished with status $status ==="
          tail -n 120 build.log || true
          exit "$status"

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          bash scripts/summarize-build-errors.sh build.log || true
          failed_pkg=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          if [ -n "$failed_pkg" ]; then
            echo "=== Rebuilding $failed_pkg with V=s ==="
            retry_status=0
            make "${failed_pkg}/compile" BUILD_LOG=1 V=s -j1 2>&1 | tee build-verbose.log || retry_status=$?
            echo "=== First errors in build-verbose.log ==="
            grep -nE "error:|Error [0-9]|FAILED|Patch failed|No rule to make target" build-verbose.log | head -40 || true
            echo "=== tail of build-verbose.log ==="
            tail -80 build-verbose.log || true
            exit "$retry_status"
          else
            echo "No failing package found in build.log" >&2
            tail -150 build.log || true
          fi

      - name: Verify device isolation
        shell: bash
        run: |
          bash scripts/check-firmware-artifacts.sh \
            --config .config \
            --directory bin/targets/airoha/an7581
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          manifest=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*manifest' -print -quit)
          test -n "$kernel_config"
          test -n "$manifest"
          bash scripts/check-gemtek-profile-isolation.sh \
            --config .config \
            --kernel-config "$kernel_config" \
            --manifest "$manifest"

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xg2010g-firmware
          path: |
            /home/runner/w/download.log
            /home/runner/w/build.log
            /home/runner/w/build-verbose.log
            /home/runner/w/logs/
            /home/runner/w/bin/targets/airoha/an7581/*.itb
            /home/runner/w/bin/targets/airoha/an7581/*manifest
            /home/runner/w/bin/targets/airoha/an7581/config.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/feeds.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/version.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Prepare checksums
        if: github.event.inputs.release_type != 'none'
        shell: bash
        run: |
          cd bin/targets/airoha/an7581
          shopt -s nullglob
          images=(*.itb)
          manifests=(*manifest)
          (( ${#images[@]} && ${#manifests[@]} )) || {
            echo "Missing firmware images or package manifests" >&2
            exit 1
          }
          sha256sum -- "${images[@]}" "${manifests[@]}" > "sha256sums-xg2010g"

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event.inputs.release_type != 'none'
        env:
          RELEASE_TAG: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          BUILD_COMMIT: ${{ steps.version.outputs.repo_commit_full }}
        run: bash scripts/check-release-tag.sh "$RELEASE_TAG" "$BUILD_COMMIT"

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          target_commitish: ${{ steps.version.outputs.repo_commit_full }}
          name: ${{ format('{0} - Gemtek XG2010G Build ({1})', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            /home/runner/w/bin/targets/airoha/an7581/*.itb
            /home/runner/w/bin/targets/airoha/an7581/*manifest
            /home/runner/w/bin/targets/airoha/an7581/config.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/feeds.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/version.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/sha256sums
            /home/runner/w/bin/targets/airoha/an7581/sha256sums-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
