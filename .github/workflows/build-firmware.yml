name: Build XG2010G Firmware

# Releases follow tags: pushing a tag vX.Y.Z builds the firmware and publishes
# the GitHub Release of that same tag (vX.Y.Z-suffix becomes a prerelease).
# A manual run is a test build that only uploads Actions artifacts.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ccache is enabled for CI builds only (see the Configure step).  The cache
  # is stored uncompressed (rules.mk sets CCACHE_NOCOMPRESS), so cap its size
  # to stay well inside the repository's 10 GB Actions cache quota.
  CCACHE_MAXSIZE: 3G

concurrency:
  group: xg2010g-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        # GitHub Actions checks out into /home/runner/work/<repo>/<repo>,
        # which pushes host-python install paths past OpenWrt's 124-char
        # limit (e.g. i2c-tools' py-smbus). Build from a short path instead.
        working-directory: /home/runner/w
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: github.ref_type == 'tag'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # Fail in seconds, not after a multi-hour build.
          tag=$GITHUB_REF_NAME
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "Release tags must look like v0.1.0 or v0.1.0-rc.1, got: $tag" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Tag $tag points to $GITHUB_SHA, which is not on main" >&2
            exit 1
          }

      - name: Create short build directory
        working-directory: ${{ github.workspace }}
        run: |
          git clone --quiet --local "$GITHUB_WORKSPACE" /home/runner/w
          git -C /home/runner/w checkout --quiet --detach "$GITHUB_SHA"

      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          # Preinstalled SDKs the firmware build never uses.  Removing them
          # leaves room for the restored download and compiler caches.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/w/dl
          key: dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dl-

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/w/.ccache
          key: ccache-${{ hashFiles('target/linux/generic/kernel-6.18') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ hashFiles('target/linux/generic/kernel-6.18') }}-
            ccache-

      - name: Generate build version
        id: version
        run: |
          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit_full=$(git rev-parse HEAD)
          repo_commit=$(git rev-parse --short=8 HEAD)
          upstream_commit=$(sed -n 's/^commit=//p' .brightspeed-upstream | cut -c1-8)
          test -n "$upstream_commit"
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          version_number="${build_date}-${repo_commit}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Release builds carry the tag as their version: LuCI, os-release
            # and the image file name all show it.
            version_number=$GITHUB_REF_NAME
          fi
          version_code="${build_id}"

          echo "date=$build_date" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "repo_commit=$repo_commit" >> "$GITHUB_OUTPUT"
          echo "repo_commit_full=$repo_commit_full" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "version_number=$version_number" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "device_model=XG2010G" >> "$GITHUB_OUTPUT"
          echo "Build version: ImmortalWrt-for-Gemtek-XG2010G $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Select feed providers
        run: FEED_PATCHES_STRICT=1 bash scripts/select-feed-providers.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure extras package feed
        run: bash scripts/set-extras-repo.sh "$GITHUB_REPOSITORY" '${{ steps.version.outputs.build_id }}'

      - name: Configure
        run: |
          bash scripts/apply-xg2010g-package-policy.sh 2010.config
          cp 2010.config .config
          # CI-only: compile through ccache so the cache restored above is
          # reused.  Local builds keep 2010.config unchanged.
          printf '%s\n' CONFIG_DEVEL=y CONFIG_CCACHE=y >> .config
          make defconfig
          grep -qx 'CONFIG_CCACHE=y' .config
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          VERSION_CODE='${{ steps.version.outputs.version_code }}' \
          VERSION_NUMBER='${{ steps.version.outputs.version_number }}' \
          bash scripts/set-build-version.sh .config
          bash scripts/check-distfeeds.sh
          bash scripts/check-gemtek-profile-isolation.sh --config .config
          bash scripts/check-xg2010g-only.sh
          grep -q '^CONFIG_VERSION_DIST="ImmortalWrt naoki66 ' .config
          grep -q '^CONFIG_VERSION_PRODUCT="XG2010G"' .config
          grep -q '^CONFIG_VERSION_NUMBER="' .config
          grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_PRODUCT|VERSION_NUMBER|VERSION_CODE|VERSION_FILENAMES|VERSION_CODE_FILENAMES)[= ]' .config

      - name: Verify libffi build dependency
        run: |
          test -f package/libs/libffi/Makefile
          awk '
            /^Source-Makefile:/ { in_libffi = ($2 == "package/libs/libffi/Makefile") }
            in_libffi && /^Package: libffi$/ { have_package = 1 }
            in_libffi && /^Build-Types:/ {
              for (i = 2; i <= NF; i++) if ($i == "host") have_host = 1
            }
            END {
              if (!have_package || !have_host) {
                print "libffi package with host build support is missing from package metadata" > "/dev/stderr"
                exit 1
              }
            }
          ' tmp/.packageinfo

      - name: Download sources
        id: download
        shell: bash
        run: |
          set -o pipefail
          make download -j$(nproc) BUILD_LOG=1 2>&1 | tee download.log

      - name: Build Firmware
        id: build
        shell: bash
        run: |
          rm -f build.status
          set -m
          (
            make -j"$(nproc)" world BUILD_LOG=1 > build.log 2>&1
            echo $? > build.status
          ) &
          pid=$!
          set +m
          i=0
          while [ ! -f build.status ]; do
            sleep 60
            i=$((i + 1))
            if grep -qE 'ERROR: .*failed to build|make: \*\*\*' build.log; then
              echo "=== build reported an error, stopping the process group ==="
              kill -TERM -- -"$pid" 2>/dev/null || true
              sleep 10
              kill -KILL -- -"$pid" 2>/dev/null || true
              break
            fi
            if [ $((i % 5)) -eq 0 ]; then
              echo "=== $(date -u +%H:%M:%S) build heartbeat ==="
              tail -n 3 build.log || true
              ps -eo etime,comm,args --sort=-etime \
                | grep -E 'cc1plus|cc1 |g\+\+|ninja|rustc' \
                | grep -v grep | head -5 || true
            fi
          done
          wait "$pid" || true
          status=$(cat build.status 2>/dev/null || echo 1)
          echo "=== build finished with status $status ==="
          tail -n 120 build.log || true
          exit "$status"

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          bash scripts/summarize-build-errors.sh build.log || true
          failed_pkg=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          if [ -n "$failed_pkg" ]; then
            echo "=== Rebuilding $failed_pkg with V=s ==="
            retry_status=0
            make "${failed_pkg}/compile" BUILD_LOG=1 V=s -j1 2>&1 | tee build-verbose.log || retry_status=$?
            echo "=== First errors in build-verbose.log ==="
            grep -nE "error:|Error [0-9]|FAILED|Patch failed|No rule to make target" build-verbose.log | head -40 || true
            echo "=== tail of build-verbose.log ==="
            tail -80 build-verbose.log || true
            exit "$retry_status"
          else
            echo "No failing package found in build.log" >&2
            tail -150 build.log || true
          fi

      - name: Save download cache
        if: always() && steps.download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/w/dl
          key: dl-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save compiler cache
        # Saved even when the build fails, so the next attempt resumes from
        # everything that compiled before the failure.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/w/.ccache
          key: ccache-${{ hashFiles('target/linux/generic/kernel-6.18') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show compiler cache statistics
        if: always() && steps.build.outcome != 'skipped'
        run: staging_dir/host/bin/ccache -s || true

      - name: Verify device isolation
        shell: bash
        run: |
          bash scripts/check-firmware-artifacts.sh \
            --config .config \
            --directory bin/targets/airoha/an7581
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          manifest=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*manifest' -print -quit)
          test -n "$kernel_config"
          test -n "$manifest"
          bash scripts/check-gemtek-profile-isolation.sh \
            --config .config \
            --kernel-config "$kernel_config" \
            --manifest "$manifest"

      - name: Publish extras package repository
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ steps.version.outputs.build_id }}
          IS_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          topdir=$PWD
          arch=$(find bin/packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          pkgall=$(find staging_dir/packages -mindepth 1 -maxdepth 1 -type d -printf '%p\n' | head -n 1)
          test -n "$arch"
          test -n "$pkgall"
          work=$(mktemp -d)
          mkdir -p "$work/$BUILD_ID/kmods" "$work/$BUILD_ID/local"

          sign_index() {
            (
              cd "$1"
              "$topdir/staging_dir/host/bin/apk" mkndx \
                --root "$topdir" --keys-dir "$topdir" --allow-untrusted \
                --sign "$topdir/private-key.pem" --output packages.adb ./*.apk
            )
          }

          # Only optional third-party feeds are published.  Device feeds are
          # installed into the image, and the official distfeeds provide the
          # rest; publishing them here would duplicate packages and risk an
          # empty feed directory turning into a 404 on the device.
          for feed in helloworld pushbot; do
            src="bin/packages/$arch/$feed"
            compgen -G "$src/*.apk" >/dev/null || {
              echo "missing packages for feed $feed" >&2
              exit 1
            }
            mkdir -p "$work/$BUILD_ID/$feed"
            cp -aL "$src/." "$work/$BUILD_ID/$feed/"
          done

          # Kernel modules are shared by the whole target and live in the
          # merged package directory, not in one of the feed directories.
          found=0
          while IFS= read -r -d '' apk; do
            cp -aL "$apk" "$work/$BUILD_ID/kmods/"
            found=1
          done < <(find "$pkgall" -maxdepth 1 -name 'kmod-*.apk' -print0)
          [ "$found" -eq 1 ]
          sign_index "$work/$BUILD_ID/kmods"

          # Optional packages built from this repository's own package/ tree
          # land in the base feed, which the official distfeeds do not carry.
          # Keep this list in sync with scripts/set-extras-repo.sh.
          for name in lucky luci-app-lucky luci-i18n-lucky-zh-cn; do
            mapfile -t apks < <(find "bin/packages/$arch/base" -maxdepth 1 -name "$name-[0-9]*.apk")
            (( ${#apks[@]} == 1 )) || {
              echo "expected one $name package in the base feed, found ${#apks[@]}" >&2
              exit 1
            }
            cp -aL "${apks[0]}" "$work/$BUILD_ID/local/"
          done
          sign_index "$work/$BUILD_ID/local"

          # Release builds keep their extras for good, so devices running any
          # published release can still install optional packages.
          if [[ "$IS_RELEASE" == true ]]; then
            touch "$work/$BUILD_ID/.release"
          fi

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          repo=$(mktemp -d)
          if git clone --quiet --depth 1 --branch packages "$remote" "$repo" 2>/dev/null; then
            git -C "$repo" checkout --quiet --orphan "packages-$BUILD_ID"
          else
            rm -rf "$repo"
            git init --quiet "$repo"
            git -C "$repo" remote add origin "$remote"
            git -C "$repo" symbolic-ref HEAD refs/heads/packages
          fi

          rm -rf "$repo/$BUILD_ID"
          cp -a "$work/$BUILD_ID" "$repo/"

          # Keep the three newest build directories plus every release build.
          # Unreleased builds older than that are dropped to keep the branch
          # small; their raw URLs stop working, which only affects devices
          # running an unreleased Actions artifact.
          mapfile -t builds < <(
            find "$repo" -maxdepth 1 -mindepth 1 -type d -name '[0-9]*' \
              -printf '%f\n' | LC_ALL=C sort
          )
          if (( ${#builds[@]} > 3 )); then
            for old in "${builds[@]:0:${#builds[@]}-3}"; do
              [[ -e "$repo/$old/.release" ]] && continue
              rm -rf "$repo/$old"
            done
          fi

          git -C "$repo" config user.name "github-actions[bot]"
          git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo" add -A
          if git -C "$repo" diff --cached --quiet; then
            echo "extras package repository unchanged"
          else
            git -C "$repo" commit --quiet -m "packages: $BUILD_ID"
            git -C "$repo" push --force origin HEAD:packages
            echo "published extras package repository for $BUILD_ID"
          fi

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xg2010g-firmware
          path: |
            /home/runner/w/download.log
            /home/runner/w/build.log
            /home/runner/w/build-verbose.log
            /home/runner/w/logs/
            /home/runner/w/bin/targets/airoha/an7581/*.itb
            /home/runner/w/bin/targets/airoha/an7581/*manifest
            /home/runner/w/bin/targets/airoha/an7581/config.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/feeds.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/version.buildinfo
            /home/runner/w/bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Prepare release image
        if: github.ref_type == 'tag'
        id: release_image
        shell: bash
        run: |
          cd bin/targets/airoha/an7581
          shopt -s nullglob
          images=(*-gemtek_xg2010g-ubi-squashfs-sysupgrade.itb)
          (( ${#images[@]} == 1 )) || {
            echo "Expected exactly one XG2010G sysupgrade image, found ${#images[@]}: ${images[*]}" >&2
            ls -la
            exit 1
          }
          echo "path=$PWD/${images[0]}" >> "$GITHUB_OUTPUT"
          echo "name=${images[0]}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum -- "${images[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build release body
        if: github.ref_type == 'tag'
        id: release_body
        env:
          IMAGE_NAME: ${{ steps.release_image.outputs.name }}
          IMAGE_SHA256: ${{ steps.release_image.outputs.sha256 }}
        run: |
          # The annotated tag message is the release text; GitHub appends the
          # generated list of changes since the previous tag.
          git -C "$GITHUB_WORKSPACE" fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git -C "$GITHUB_WORKSPACE" for-each-ref "refs/tags/$GITHUB_REF_NAME" \
            --format='%(if)%(*objecttype)%(then)%(contents)%(end)')
          {
            printf '%s\n' "$notes"
            echo ""
            echo "| 固件 | SHA256 |"
            echo "| --- | --- |"
            echo "| \`$IMAGE_NAME\` | \`$IMAGE_SHA256\` |"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ steps.version.outputs.repo_commit_full }}
        run: bash scripts/check-release-tag.sh "$RELEASE_TAG" "$BUILD_COMMIT"

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('{0} - Gemtek XG2010G', github.ref_name) }}
          body: ${{ steps.release_body.outputs.body }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.release_image.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
